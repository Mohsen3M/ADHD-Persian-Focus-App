<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dopamine Focus Engine</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Focus">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(17, 23, 34, 0.85);
      --card-border: rgba(56, 189, 248, 0.12);
      --card-hover-border: rgba(56, 189, 248, 0.35);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --sprint1: #38bdf8;
      --sprint1-glow: rgba(56, 189, 248, 0.35);
      --rest: #64748b;
      --sprint2: #10b981;
      --reward: #f59e0b;
      --danger: #f43f5e;
      --purple: #c084fc;
      --gamma: #fb923c;
    }

    * {
      box-sizing: border-box;
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 16px;
      background: radial-gradient(circle at 50% 10%, #111827 0%, #07090e 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background 0.8s ease;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 480px;
      width: 100%;
      margin: auto;
    }

    @media (min-width: 900px) {
      .dashboard {
        grid-template-columns: 410px 460px;
        max-width: 910px;
        gap: 26px;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: border-color 0.3s ease;
    }

    .panel:hover { border-color: var(--card-hover-border); }

    .xp-banner {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .xp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      font-weight: 800;
    }

    .xp-level { color: var(--purple); }
    .xp-points { color: var(--sprint1); font-variant-numeric: tabular-nums; }

    .xp-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sprint1), var(--purple));
      width: 0%;
      border-radius: 10px;
      box-shadow: 0 0 10px var(--purple);
      transition: width 0.4s ease;
    }

    .timer-panel { align-items: center; text-align: center; }

    .phase-badge {
      font-size: 0.92rem;
      font-weight: 800;
      padding: 8px 20px;
      border-radius: 30px;
      margin-bottom: 20px;
      letter-spacing: -0.3px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.4s ease;
    }

    .timer-wrap {
      position: relative;
      width: 226px;
      height: 226px;
      margin: 4px 0 16px 0;
    }

    svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 12px var(--sprint1-glow));
      transition: filter 0.4s ease;
    }

    circle { fill: none; stroke-width: 11; }
    .bg-circle { stroke: rgba(255, 255, 255, 0.05); }

    .progress-circle {
      stroke: var(--sprint1);
      stroke-linecap: round;
      stroke-dasharray: 615;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
    }

    .time-display {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3.3rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    button {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      transition: all 0.2s;
    }

    button:hover { background: rgba(51, 65, 85, 0.8); border-color: rgba(255, 255, 255, 0.2); }
    button:active { transform: scale(0.96); }

    button.primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #040810;
      border: none;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    button.active-noise { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: #34d399; }
    button.active-gamma { background: rgba(251, 146, 60, 0.15); color: #fb923c; border-color: #fb923c; }

    .anchor-box { margin-top: 18px; width: 100%; text-align: right; }
    .anchor-box label {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .anchor-box input {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      outline: none;
    }

    .anchor-box input:focus { border-color: var(--sprint1); }

    .anchor-alert {
      color: var(--danger);
      font-size: 0.78rem;
      font-weight: 800;
      display: none;
      margin-top: 8px;
      animation: pulse 1s infinite alternate;
    }

    .shortcuts-bar {
      margin-top: 16px;
      font-size: 0.7rem;
      color: #64748b;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .shortcuts-bar kbd {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 2px 6px;
      color: #cbd5e1;
    }

    .section-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge-count {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .input-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
    .input-wrap input {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.84rem;
      outline: none;
    }
    .input-wrap input:focus { border-color: var(--sprint1); }

    .task-list, .tangent-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
      max-height: 125px;
      overflow-y: auto;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 12px;
      border-radius: 12px;
      margin-bottom: 6px;
      font-size: 0.84rem;
    }

    .item-row.completed { opacity: 0.4; text-decoration: line-through; }
    .item-row label { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; }
    .item-row input[type="checkbox"] { accent-color: var(--sprint2); width: 17px; height: 17px; }

    .tangent-row { background: rgba(245, 158, 11, 0.05); border-color: rgba(245, 158, 11, 0.15); color: #fde68a; }

    .delete-btn { background: transparent; border: none; color: #64748b; padding: 4px 8px; font-size: 1rem; cursor: pointer; }
    .delete-btn:hover { color: var(--danger); }

    .notes-area {
      width: 100%;
      height: 90px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 12px;
      color: #e2e8f0;
      font-size: 0.84rem;
      resize: none;
      outline: none;
      line-height: 1.6;
    }
    .notes-area:focus { border-color: var(--sprint1); }

    .notes-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .word-counter-badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--sprint1);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="panel timer-panel">
    <div id="phaseBadge" class="phase-badge">اسپرینت ۱ (حمله ۲۲ دقیقه‌ای)</div>
    
    <div class="timer-wrap">
      <svg>
        <circle class="bg-circle" cx="113" cy="113" r="98"></circle>
        <circle id="progress" class="progress-circle" cx="113" cy="113" r="98"></circle>
      </svg>
      <div id="timeText" class="time-display">22:00</div>
    </div>

    <div class="controls-grid">
      <button id="startBtn" class="primary" onclick="toggleTimer()">⚡ شروع</button>
      <button id="noiseBtn" onclick="toggleBrownNoise()">🌊 نویز بم</button>
      <button id="gammaBtn" onclick="toggleGammaWave()">🧠 ۴۰Hz</button>
      <button onclick="resetTimer()">↺ ریست</button>
      <button onclick="skipPhase()">⏭ بعدی</button>
      <button onclick="toggleFullScreen()">⛶ فول</button>
    </div>

    <div class="anchor-box">
      <label>
        <span>🎯 لنگر شروع دوباره:</span>
        <span style="color: var(--text-muted); font-size: 0.68rem;">Bookmark Hack</span>
      </label>
      <input id="anchorInput" type="text" placeholder="مثلاً: شروع نوشتن پاراگراف دوم...">
      <div id="anchorAlert" class="anchor-alert">⚠️ ۳۰ ثانیه مانده! دست بکش و بلند شو.</div>
    </div>

    <div class="shortcuts-bar">
      <span><kbd>Space</kbd> تایمر</span>
      <span><kbd>B</kbd> نویز بم</span>
      <span><kbd>G</kbd> موج گاما</span>
      <span><kbd>R</kbd> ریست</span>
    </div>
  </div>

  <div class="panel">
    <div class="xp-banner">
      <div class="xp-header">
        <span id="levelDisplay" class="xp-level">⚡ لول ۱ (جنگجوی دوپامین)</span>
        <span id="xpDisplay" class="xp-points">0 / 300 XP</span>
      </div>
      <div class="xp-bar-bg">
        <div id="xpBarFill" class="xp-bar-fill"></div>
      </div>
    </div>

    <div class="section-title">
      <span>🎯 ریز‌تسک‌های حمله <span style="font-size: 0.72rem; color: var(--purple);">+50 XP</span></span>
      <span id="taskCount" class="badge-count">۰ تسک</span>
    </div>
    <div class="input-wrap">
      <input id="newTaskInput" type="text" placeholder="اقدام ۳ تا ۱۰ دقیقه‌ای..." onkeypress="handleKey(event, addTask)">
      <button class="primary" style="min-width: 60px;" onclick="addTask()">ثبت</button>
    </div>
    <ul id="taskList" class="task-list"></ul>

    <div class="section-title" style="color: #fde68a;">
      <span>🧠 پارک افکار مزاحم (Brain Dump)</span>
      <span id="tangentCount" class="badge-count">۰ فکر</span>
    </div>
    <div class="input-wrap">
      <input id="newTangentInput" type="text" placeholder="فکری که پرید توی سرت..." onkeypress="handleKey(event, addTangent)">
      <button style="background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.3); color: #fde68a;" onclick="addTangent()">پارک</button>
    </div>
    <ul id="tangentList" class="tangent-list"></ul>

    <div class="section-title">
      <span>📝 پیش‌نویس، تمپلیت و یادداشت</span>
    </div>
    <textarea id="notesArea" class="notes-area" placeholder="تمپلیت‌ها یا یادداشت‌های مهم..." oninput="handleNotesInput()"></textarea>
    <div class="notes-footer">
      <span>ذخیره خودکار ✓</span>
      <span id="wordCountBadge" class="word-counter-badge">۰ کلمه</span>
    </div>
  </div>
</div>

<script>
  const safeStorage = {
    get: function(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch (e) { return defaultVal; }
    },
    set: function(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }
  };

  const PROTOCOL = [
    { name: "اسپرینت ۱ (حمله ۲۲ دقیقه‌ای)", tag: "حمله ۱", duration: 22 * 60, color: "#38bdf8", glow: "rgba(56, 189, 248, 0.4)", bg: "radial-gradient(circle at 50% 10%, #0c2340 0%, #07090e 100%)" },
    { name: "ریست خسته‌کننده (بدون گوشی!)", tag: "استراحت", duration: 3 * 60, color: "#64748b", glow: "rgba(100, 116, 139, 0.2)", bg: "radial-gradient(circle at 50% 10%, #050608 0%, #020304 100%)" },
    { name: "اسپرینت ۲ (تکمیل نهایی)", tag: "حمله ۲", duration: 22 * 60, color: "#10b981", glow: "rgba(16, 185, 129, 0.4)", bg: "radial-gradient(circle at 50% 10%, #062b1e 0%, #07090e 100%)" },
    { name: "پاداش آزاد (تخلیه دوپامین)", tag: "پاداش", duration: 12 * 60, color: "#f59e0b", glow: "rgba(245, 158, 11, 0.4)", bg: "radial-gradient(circle at 50% 10%, #291804 0%, #07090e 100%)" }
  ];

  let currentPhase = 0;
  let timeLeft = PROTOCOL[0].duration;
  let timerId = null;
  const CIRCLE_LENGTH = 2 * Math.PI * 98;

  const circle = document.getElementById("progress");
  const timeText = document.getElementById("timeText");
  const phaseBadge = document.getElementById("phaseBadge");
  const startBtn = document.getElementById("startBtn");
  const anchorAlert = document.getElementById("anchorAlert");

  let audioCtx = null;
  function getAudioCtx() {
    try {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch(e) {}
    return audioCtx;
  }

  document.addEventListener('touchstart', () => { getAudioCtx(); }, { once: true });

  function playTone(freq, duration) {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function playRewardChime() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.07 + 0.3);
        osc.stop(ctx.currentTime + i * 0.07 + 0.3);
      });
    } catch(e) {}
  }

  function playLevelUpFanfare() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      [440, 554.37, 659.25, 880].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
        osc.stop(ctx.currentTime + 0.6);
      });
    } catch(e) {}
  }

  let noiseNode = null, isNoisePlaying = false;
  function toggleBrownNoise() {
    const btn = document.getElementById("noiseBtn");
    const ctx = getAudioCtx();
    if (!ctx) return;

    if (isNoisePlaying) {
      if (noiseNode) { try { noiseNode.stop(); noiseNode.disconnect(); } catch(e) {} noiseNode = null; }
      isNoisePlaying = false;
      btn.classList.remove("active-noise");
      btn.innerText = "🌊 نویز بم";
    } else {
      const bufferSize = ctx.sampleRate * 4;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        data[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = data[i];
        data[i] *= 3.5;
      }
      noiseNode = ctx.createBufferSource();
      noiseNode.buffer = buffer;
      noiseNode.loop = true;
      const gain = ctx.createGain();
      gain.gain.value = 0.16;
      noiseNode.connect(gain);
      gain.connect(ctx.destination);
      noiseNode.start();
      isNoisePlaying = true;
      btn.classList.add("active-noise");
      btn.innerText = "قطع نویز 🔊";
    }
  }

  let gammaOscL = null, gammaOscR = null, isGammaPlaying = false;
  function toggleGammaWave() {
    const btn = document.getElementById("gammaBtn");
    const ctx = getAudioCtx();
    if (!ctx) return;

    if (isGammaPlaying) {
      if (gammaOscL) { try { gammaOscL.stop(); gammaOscL.disconnect(); } catch(e) {} gammaOscL = null; }
      if (gammaOscR) { try { gammaOscR.stop(); gammaOscR.disconnect(); } catch(e) {} gammaOscR = null; }
      isGammaPlaying = false;
      btn.classList.remove("active-gamma");
      btn.innerText = "🧠 ۴۰Hz";
    } else {
      const merger = ctx.createChannelMerger(2);
      const gammaGain = ctx.createGain();
      gammaGain.gain.value = 0.08;
      gammaOscL = ctx.createOscillator();
      gammaOscL.frequency.value = 200;
      gammaOscL.connect(merger, 0, 0);
      gammaOscR = ctx.createOscillator();
      gammaOscR.frequency.value = 240;
      gammaOscR.connect(merger, 0, 1);
      merger.connect(gammaGain);
      gammaGain.connect(ctx.destination);
      gammaOscL.start();
      gammaOscR.start();
      isGammaPlaying = true;
      btn.classList.add("active-gamma");
      btn.innerText = "قطع ۴۰Hz ⚡";
    }
  }

  let xp = safeStorage.get('focus_xp', 0);
  const XP_PER_LEVEL = 300;

  function addXP(amount) {
    const oldLevel = Math.floor(xp / XP_PER_LEVEL) + 1;
    xp += amount;
    const newLevel = Math.floor(xp / XP_PER_LEVEL) + 1;
    safeStorage.set('focus_xp', xp);
    renderXP();
    if (newLevel > oldLevel) playLevelUpFanfare();
  }

  function renderXP() {
    const currentLevel = Math.floor(xp / XP_PER_LEVEL) + 1;
    const currentLevelXP = xp % XP_PER_LEVEL;
    const percent = (currentLevelXP / XP_PER_LEVEL) * 100;
    document.getElementById("levelDisplay").innerText = `⚡ لول ${currentLevel} (جنگجوی دوپامین)`;
    document.getElementById("xpDisplay").innerText = `${currentLevelXP} / ${XP_PER_LEVEL} XP`;
    document.getElementById("xpBarFill").style.width = `${percent}%`;
  }

  function updateDisplay() {
    const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const sec = (timeLeft % 60).toString().padStart(2, '0');
    timeText.innerText = `${min}:${sec}`;
    document.title = `(${min}:${sec}) 🎯 ${PROTOCOL[currentPhase].tag}`;

    const total = PROTOCOL[currentPhase].duration;
    const offset = CIRCLE_LENGTH - (timeLeft / total) * CIRCLE_LENGTH;
    circle.style.strokeDashoffset = offset;

    if (currentPhase === 0 && timeLeft <= 30 && timeLeft > 0) {
      anchorAlert.style.display = "block";
      if (timeLeft === 30) playTone(587, 0.4);
    } else {
      anchorAlert.style.display = "none";
    }
  }

  function updatePhaseStyles() {
    const phase = PROTOCOL[currentPhase];
    phaseBadge.innerText = phase.name;
    phaseBadge.style.background = phase.color + "22";
    phaseBadge.style.color = phase.color;
    phaseBadge.style.border = `1px solid ${phase.color}55`;
    circle.style.stroke = phase.color;
    document.querySelector("svg").style.filter = `drop-shadow(0 0 12px ${phase.glow})`;
    document.body.style.background = phase.bg;
  }

  function toggleTimer() {
    getAudioCtx();
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
      startBtn.innerText = "▶ ادامه";
      startBtn.classList.remove("primary");
    } else {
      startBtn.innerText = "⏸ توقف";
      startBtn.classList.add("primary");
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          playTone(880, 0.9);
          if (currentPhase === 0 || currentPhase === 2) addXP(100);
          nextPhase();
        }
      }, 1000);
    }
  }

  function resetTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    startBtn.innerText = "⚡ شروع";
    startBtn.classList.add("primary");
    timeLeft = PROTOCOL[currentPhase].duration;
    updateDisplay();
  }

  function nextPhase() {
    currentPhase = (currentPhase + 1) % PROTOCOL.length;
    timeLeft = PROTOCOL[currentPhase].duration;
    updatePhaseStyles();
    updateDisplay();
  }

  function skipPhase() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    startBtn.innerText = "⚡ شروع";
    startBtn.classList.add("primary");
    nextPhase();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  window.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
    else if (e.key === 'b' || e.key === 'B' || e.key === 'ذ') toggleBrownNoise();
    else if (e.key === 'g' || e.key === 'G' || e.key === 'ل') toggleGammaWave();
    else if (e.key === 'r' || e.key === 'R' || e.key === 'ق') resetTimer();
    else if (e.key === 'n' || e.key === 'N' || e.key === 'د') skipPhase();
  });

  let tasks = safeStorage.get('adhd_tasks', []);
  function renderTasks() {
    const list = document.getElementById("taskList");
    const countBadge = document.getElementById("taskCount");
    list.innerHTML = "";
    tasks.forEach((task, index) => {
      const li = document.createElement("li");
      li.className = `item-row ${task.completed ? 'completed' : ''}`;
      li.innerHTML = `
        <label>
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
          <span>${task.text}</span>
        </label>
        <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
      `;
      list.appendChild(li);
    });
    countBadge.innerText = `${tasks.length} تسک`;
    safeStorage.set('adhd_tasks', tasks);
  }

  function addTask() {
    const input = document.getElementById("newTaskInput");
    const val = input.value.trim();
    if (val) {
      tasks.push({ text: val, completed: false });
      input.value = "";
      renderTasks();
    }
  }

  function toggleTask(index) {
    tasks[index].completed = !tasks[index].completed;
    if (tasks[index].completed) { playRewardChime(); addXP(50); }
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    renderTasks();
  }

  let tangents = safeStorage.get('adhd_tangents', []);
  function renderTangents() {
    const list = document.getElementById("tangentList");
    const countBadge = document.getElementById("tangentCount");
    list.innerHTML = "";
    tangents.forEach((item, index) => {
      const li = document.createElement("li");
      li.className = "item-row tangent-row";
      li.innerHTML = `
        <span>📌 ${item}</span>
        <button class="delete-btn" onclick="deleteTangent(${index})">✕</button>
      `;
      list.appendChild(li);
    });
    countBadge.innerText = `${tangents.length} فکر`;
    safeStorage.set('adhd_tangents', tangents);
  }

  function addTangent() {
    const input = document.getElementById("newTangentInput");
    const val = input.value.trim();
    if (val) {
      tangents.push(val);
      input.value = "";
      renderTangents();
    }
  }

  function deleteTangent(index) {
    tangents.splice(index, 1);
    renderTangents();
  }

  function handleKey(e, callback) { if (e.key === 'Enter') callback(); }

  const notesArea = document.getElementById("notesArea");
  const wordCountBadge = document.getElementById("wordCountBadge");
  notesArea.value = safeStorage.get('adhd_notes', '');

  function countWords(str) {
    const matches = str.trim().match(/[\w\d\u0600-\u06FF]+/gi);
    return matches ? matches.length : 0;
  }

  function handleNotesInput() {
    safeStorage.set('adhd_notes', notesArea.value);
    const count = countWords(notesArea.value);
    wordCountBadge.innerText = `${count} کلمه`;
  }

  // ثبت رسمی Service Worker برای نصب PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  circle.style.strokeDasharray = CIRCLE_LENGTH;
  updatePhaseStyles();
  updateDisplay();
  renderXP();
  renderTasks();
  renderTangents();
  handleNotesInput();
</script>
</body>
</html>
